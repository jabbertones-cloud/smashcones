name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: smashcones-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, macOS, ARM64, smat-m1]
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Enforce physical M1
        run: |
          test "$(hostname)" = "Tatsheens-Mini"
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 793e209ea35f2e064b4b49b168a26c22
        run: npx --yes wrangler@4 pages deploy . --project-name smashcones
